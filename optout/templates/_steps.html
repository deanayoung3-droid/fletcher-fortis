{% set step = 1 if '/invite/' in request.url.path else (2 if request.url.path.endswith('/authorize') else 3) %}<ol class="flex items-center gap-2 mb-5 text-[12.5px]" aria-label="Setup progress">
{% for n, t in [(1,'Accept'),(2,'Sign'),(3,'Your details'),(4,'Done')] %}<li class="flex items-center gap-2 {{'text-ink dark:text-white font-medium' if n == step else 'text-stone-400'}}"><span class="w-6 h-6 rounded-full grid place-items-center text-[11.5px] font-semibold {{'bg-ink text-white dark:bg-white dark:text-ink' if n == step else ('bg-emerald-100 text-emerald-700 dark:bg-emerald-400/15 dark:text-emerald-300' if n < step else 'bg-stone-100 dark:bg-white/[.06]')}}">{{'✓' if n < step else n}}</span><span class="hidden sm:inline">{{t}}</span></li>{% if not loop.last %}<li class="flex-1 h-px bg-stone-200 dark:bg-white/10 min-w-[12px]" aria-hidden="true"></li>{% endif %}{% endfor %}</ol>
