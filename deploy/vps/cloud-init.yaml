#cloud-config
# Fletcher Fortis on any Ubuntu 24.04 VPS (Hetzner, DigitalOcean, Vultr, ...): paste this as "user data" / "cloud config"
# when creating the server. It installs Docker, adds 2 GB swap and a firewall (22/80/443), and starts the app behind
# Caddy (automatic HTTPS) plus a Watchtower sidecar for one-click updates from Heartbeat.
# Before creating the server, point the DNS A record for DOMAIN at the server IP (Cloudflare: DNS only / grey cloud),
# or Caddy can't get a certificate (it retries on its own once DNS resolves).
# When it's up (~3 min):  ssh root@SERVER cat /root/fletcher-fortis-setup-url.txt
package_update: true
packages: [ca-certificates, curl, ufw]
write_files:
  - path: /opt/fletcher-fortis/.env
    permissions: "0600"
    content: |
      DOMAIN=app.fletcherfortis.com
      IMAGE=ghcr.io/deanayoung3-droid/fletcher-fortis:latest
      PUBLIC_URL=https://app.fletcherfortis.com
      FROM_ADDRESS=privacy@fletcherfortis.com
      MAIL_DOMAIN=fletcherfortis.com
      DRY_RUN=true
      COOKIE_SECURE=true
      TRUST_CF_HEADER=false
      TZ=America/Los_Angeles
      # FF_DATA_KEY and WATCHTOWER_TOKEN are appended on first boot (see runcmd)
  - path: /opt/fletcher-fortis/Caddyfile
    content: |
      {$DOMAIN} {
        encode zstd gzip
        reverse_proxy app:8080
      }
  - path: /opt/fletcher-fortis/compose.yaml
    content: |
      services:
        app:
          image: ${IMAGE}
          env_file: .env
          environment:
            WATCHTOWER_URL: http://watchtower:8080
          labels: { com.centurylinklabs.watchtower.enable: "true" }
          user: "10001:10001"
          read_only: true
          cap_drop: [ALL]
          security_opt: ["no-new-privileges:true"]
          tmpfs: ["/tmp:size=512m,mode=1777"]
          volumes: ["ff-data:/data"]
          mem_limit: 1500m
          shm_size: 512m
          restart: unless-stopped
        caddy:
          image: caddy:2.10-alpine
          restart: unless-stopped
          ports: ["80:80", "443:443", "443:443/udp"]
          environment: { DOMAIN: "${DOMAIN}" }
          volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data"]
          depends_on: [app]
        watchtower:   # updates only the app container, only when Heartbeat asks (token-protected API, no polling)
          image: nickfedor/watchtower:latest
          restart: unless-stopped
          security_opt: ["no-new-privileges:true"]
          environment:
            WATCHTOWER_LABEL_ENABLE: "true"
            WATCHTOWER_HTTP_API_UPDATE: "true"
            WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN}
            WATCHTOWER_CLEANUP: "true"
          volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
      volumes: { ff-data: {}, caddy: {} }
  - path: /usr/local/bin/ff-setup-url
    permissions: "0755"
    content: |
      #!/bin/sh
      # Prints the one-time setup URL from the app log (new token on every restart, gone once the admin exists).
      cd /opt/fletcher-fortis && docker compose logs app 2>/dev/null | grep "Setup URL" | tail -1
runcmd:
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - ufw allow OpenSSH && ufw allow 80/tcp && ufw allow 443 && ufw --force enable
  - curl -fsSL https://get.docker.com | sh
  - cd /opt/fletcher-fortis && echo "FF_DATA_KEY=$(openssl rand -base64 48 | tr -d '\n')" >> .env && echo "WATCHTOWER_TOKEN=$(openssl rand -hex 24)" >> .env
  - cd /opt/fletcher-fortis && docker compose pull && docker compose up -d
  - for i in $(seq 1 60); do u=$(/usr/local/bin/ff-setup-url); [ -n "$u" ] && break; sleep 5; done; echo "$u" > /root/fletcher-fortis-setup-url.txt; echo "Fletcher Fortis $u" | tee /dev/console
final_message: "Fletcher Fortis is up. Setup link: ssh in and run ff-setup-url. Back up FF_DATA_KEY from /opt/fletcher-fortis/.env to your password manager."
