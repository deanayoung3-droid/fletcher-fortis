name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write     # create the GitHub Release
  packages: write     # push to GHCR
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION
        run: |
          v="${GITHUB_REF_NAME#v}"; f="$(tr -d ' \n' < VERSION)"
          [ "$v" = "$f" ] || { echo "tag $GITHUB_REF_NAME != VERSION $f"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Changelog section
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[?v?"v"([] ]|$)" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $VERSION" > notes.md
          printf '\n\nImage: `ghcr.io/%s:%s` (linux/amd64, linux/arm64)\n' "${GITHUB_REPOSITORY,,}" "$VERSION" >> notes.md
      - uses: softprops/action-gh-release@v2
        with: { name: "v${{ env.VERSION }}", body_path: notes.md }
